version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    command: ['/app/deploy/backend/entrypoint.sh']
    env_file: .env.example
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '8000'

  worker:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    command: ['/app/deploy/backend/celery-worker.sh']
    env_file: .env.example
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    command: ['/app/deploy/backend/celery-beat.sh']
    env_file: .env.example
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    command: ['celery', '-A', 'config.celery_app', 'flower', '--port=5555']
    env_file: .env.example
    volumes:
      - ./backend:/app/backend
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - '5555'

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    env_file: .env.example
    volumes:
      - ./frontend:/app/frontend
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
