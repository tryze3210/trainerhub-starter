services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-trainerhub-backend:local}
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    command: ["/app/deploy/backend/entrypoint.sh"]
    env_file: ${TRAINERHUB_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  release:
    image: ${BACKEND_IMAGE:-trainerhub-backend:local}
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: "no"
    command: ["/app/deploy/backend/release.sh"]
    env_file: ${TRAINERHUB_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${BACKEND_IMAGE:-trainerhub-backend:local}
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    command: ["/app/deploy/backend/celery-worker.sh"]
    env_file: ${TRAINERHUB_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: ${BACKEND_IMAGE:-trainerhub-backend:local}
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    command: ["/app/deploy/backend/celery-beat.sh"]
    env_file: ${TRAINERHUB_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: ${BACKEND_IMAGE:-trainerhub-backend:local}
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "config.celery_app", "flower", "--port=5555"]
    env_file: ${TRAINERHUB_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5555"

  frontend:
    image: ${FRONTEND_IMAGE:-trainerhub-frontend:local}
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_API_BASE: /api/v1
    restart: unless-stopped
    env_file: ${TRAINERHUB_ENV_FILE:-.env}
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_API_BASE: /api/v1
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
